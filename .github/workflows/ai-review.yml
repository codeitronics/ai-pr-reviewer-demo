name: AI review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: codeitronics/ai-pr-reviewer@v1
        with:
          api_key: ${{ secrets.DEEPSEEK_API_KEY }}
          provider: deepseek
